name: Publish FutureDev

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - name: Verify curriculum and progression
        run: npm test && npm run check
      - name: Prepare static site
        if: vars.SUPABASE_URL != '' && vars.SUPABASE_PUBLISHABLE_KEY != ''
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm run build
          mv dist _site
      - name: Check initial Pages setup
        id: pages
        uses: actions/github-script@v7
        with:
          script: |
            if (!process.env.SUPABASE_URL || !process.env.SUPABASE_PUBLISHABLE_KEY) {
              core.setOutput('ready', 'false');
              core.notice('Cloud build requires public Supabase project configuration. Production hosting is Vercel.');
              return;
            }
            try {
              const { data } = await github.rest.repos.getPages({ owner: context.repo.owner, repo: context.repo.repo });
              core.setOutput('ready', data.build_type === 'workflow' ? 'true' : 'false');
              if (data.build_type !== 'workflow') core.notice('Pages usa publicação por branch. A validação está concluída; o GitHub publica a branch selecionada.');
            } catch (error) {
              if (error.status !== 404 && error.status !== 403) throw error;
              core.setOutput('ready', 'false');
              core.notice('Para a primeira publicação, selecione GitHub Actions em Settings > Pages e execute este workflow novamente.');
            }
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      - name: Configure Pages
        if: steps.pages.outputs.ready == 'true'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: steps.pages.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: needs.verify.outputs.pages_enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
